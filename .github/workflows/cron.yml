name: CRM Pipeline

# External scheduler for the CRM's cron routes.
#
# WHY THIS EXISTS: these routes are plain HTTP endpoints guarded by CRON_SECRET,
# so GitHub can schedule them without duplicating schedules in vercel.json.
# Discovery runs daily, with small processing batches three times daily.
# Inbox polling and due follow-ups run hourly during Phoenix business hours.
#
# SETUP (one time):
#   1. Repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#        CRON_SECRET  = the value from the Vercel project's env vars
#        APP_URL      = https://fullstack-crm-nine.vercel.app
#   2. Commit this file. Actions runs it automatically.
#   3. Actions tab -> "CRM Pipeline" -> "Run workflow" to trigger manually.
#
# NOTE: GitHub disables scheduled workflows after 60 days of repo inactivity,
# and scheduled runs can be delayed by several minutes under platform load.
# Neither matters for this pipeline, but don't treat the timing as exact.

on:
  schedule:
    # Phoenix stays on UTC-7 year-round. Order matters: discovery -> enrichment
    # -> scoring -> outreach -> digest.
    - cron: "0 13 * * *"        # discover-leads       — daily 06:00 Phoenix
    - cron: "0 14,17,20 * * *"        # enrich-leads         — 07:00, 10:00, 13:00 Phoenix
    - cron: "45 14,17,20 * * *"        # research-leads       — 07:45, 10:45, 13:45 Phoenix
    - cron: "0 15,18,21 * * *"        # process-discovered   — 08:00, 11:00, 14:00 Phoenix
    - cron: "0 16,19,22 * * *"        # automation           — 09:00, 12:00, 15:00 Phoenix
    - cron: "0 1 * * *"        # daily-digest         — daily 18:00 Phoenix

    # Check replies before processing due follow-ups.
    - cron: "30 14-23 * * *"       # poll-replies         — hourly 07:30–16:30 Phoenix
    - cron: "35 14-23 * * *"       # process-followups    — hourly 07:35–16:35 Phoenix
  workflow_dispatch:
    inputs:
      route:
        description: "Run a single route now"
        required: true
        default: automation
        type: choice
        options: [discover-leads, automation, enrich-leads, research-leads, process-discovered-leads, process-followups, daily-digest, poll-replies]

concurrency:
  group: crm-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select routes for this trigger
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "routes=${{ inputs.route }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "0 13 * * *")      echo "routes=discover-leads" >> "$GITHUB_OUTPUT" ;;
              "0 14,17,20 * * *")      echo "routes=enrich-leads" >> "$GITHUB_OUTPUT" ;;
              "45 14,17,20 * * *")     echo "routes=research-leads" >> "$GITHUB_OUTPUT" ;;
              "0 15,18,21 * * *")      echo "routes=process-discovered-leads" >> "$GITHUB_OUTPUT" ;;
              "0 16,19,22 * * *")      echo "routes=automation" >> "$GITHUB_OUTPUT" ;;
              "0 1 * * *")      echo "routes=daily-digest" >> "$GITHUB_OUTPUT" ;;
              "30 14-23 * * *")     echo "routes=poll-replies" >> "$GITHUB_OUTPUT" ;;
              "35 14-23 * * *")     echo "routes=process-followups" >> "$GITHUB_OUTPUT" ;;
              *)                 echo "routes=" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Trigger route
        env:
          # Accept either secret name. The repo secret was originally created as
          # NEXT_PUBLIC_APP_URL, which resolved to empty against `secrets.APP_URL`
          # and failed every run with "curl: (3) No host part in the URL". The
          # literal is the last resort so a missing secret cannot silently
          # reintroduce that failure.
          APP_URL: ${{ secrets.APP_URL || secrets.NEXT_PUBLIC_APP_URL || 'https://fullstack-crm-nine.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          ROUTE="${{ steps.pick.outputs.routes }}"
          [ -n "$ROUTE" ] || { echo "No route mapped to this trigger"; exit 0; }

          # Fail loudly on an unset secret rather than emitting a bare 401.
          [ -n "${CRON_SECRET:-}" ] || { echo "::error::CRON_SECRET secret is empty"; exit 1; }

          for ATTEMPT in 1 2 3; do
            echo "→ GET $APP_URL/api/cron/$ROUTE"
            # Discovery and follow-ups can run for 120s. Wait beyond the server's
            # deadline so a slow successful run is not reported as a client failure.
            # A disconnected request may already have sent mail: never retry it.
            if CODE=$(curl -sS -o body.json -w '%{http_code}' \
                        --connect-timeout 15 --max-time 150 \
                        -H "Authorization: Bearer $CRON_SECRET" \
                        "$APP_URL/api/cron/$ROUTE"); then
              :
            else
              CURL_EXIT=$?
              echo "::error::$ROUTE transport failed (curl exit $CURL_EXIT, HTTP $CODE). Server work may still have completed; inspect logs before rerunning."
              exit "$CURL_EXIT"
            fi

            echo "HTTP $CODE"
            cat body.json; echo
            # Retry only an explicit confirmation that no stage work started.
            # Unknown errors and lost responses must never repeat email work.
            if [ "$CODE" = "500" ] && [ "$ATTEMPT" -lt 3 ] && python3 -c 'import json; b=json.load(open("body.json")); raise SystemExit(0 if b.get("success") is False and b.get("stageStarted") is False and b.get("retryable") is True else 1)' 2>/dev/null; then
              echo "Database unavailable before processing; retrying in $((ATTEMPT * 10)) seconds"
              sleep "$((ATTEMPT * 10))"
              continue
            fi
            break
          done

          # A 200 alone is NOT success: the unauthenticated health check on some
          # routes also returns 200. Treat a health-check shape as a failure so a
          # broken secret can never look like a working job.
          if [ "$CODE" != "200" ]; then
            echo "::error::$ROUTE returned HTTP $CODE"; exit 1
          fi
          if grep -q '"note".*health check' body.json; then
            echo "::error::$ROUTE returned the health check — CRON_SECRET is wrong or missing"; exit 1
          fi
          echo "✓ $ROUTE completed"
