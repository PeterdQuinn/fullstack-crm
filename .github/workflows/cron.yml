name: CRM Pipeline

# External scheduler for the CRM's cron routes.
#
# WHY THIS EXISTS: these routes are plain HTTP endpoints guarded by CRON_SECRET,
# so GitHub can schedule them without duplicating schedules in vercel.json.
# Heavy work is deliberately weekly to protect the Vercel Hobby allowance;
# mailbox polling remains daily so replies do not sit unseen for a week.
#
# SETUP (one time):
#   1. Repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#        CRON_SECRET  = the value from the Vercel project's env vars
#        APP_URL      = https://fullstack-crm-nine.vercel.app
#   2. Commit this file. Actions runs it automatically.
#   3. Actions tab -> "CRM Pipeline" -> "Run workflow" to trigger manually.
#
# NOTE: GitHub disables scheduled workflows after 60 days of repo inactivity,
# and scheduled runs can be delayed by several minutes under platform load.
# Neither matters for this pipeline, but don't treat the timing as exact.

on:
  schedule:
    # Phoenix stays on UTC-7 year-round. Order matters: discovery -> enrichment
    # -> scoring -> outreach -> follow-ups -> digest.
    - cron: "0 13 * * 1"        # discover-leads       — Monday 06:00 Phoenix
    - cron: "0 14 * * 1"        # enrich-leads         — Monday 07:00 Phoenix
    - cron: "0 15 * * 1"        # process-discovered   — Monday 08:00 Phoenix
    - cron: "0 16 * * 1"        # automation           — Monday 09:00 Phoenix
    - cron: "0 17 * * 1"        # process-followups    — Monday 10:00 Phoenix
    - cron: "0 19 * * 1"        # daily-digest         — Monday 12:00 Phoenix

    # Offset from Monday's enrichment run to avoid concurrent functions.
    - cron: "30 14 * * *"       # poll-replies         — daily 07:30 Phoenix
  workflow_dispatch:
    inputs:
      route:
        description: "Run a single route now"
        required: true
        default: automation
        type: choice
        options: [discover-leads, automation, enrich-leads, process-discovered-leads, process-followups, daily-digest, poll-replies]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Select routes for this trigger
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "routes=${{ inputs.route }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "0 13 * * 1")      echo "routes=discover-leads" >> "$GITHUB_OUTPUT" ;;
              "0 14 * * 1")      echo "routes=enrich-leads" >> "$GITHUB_OUTPUT" ;;
              "0 15 * * 1")      echo "routes=process-discovered-leads" >> "$GITHUB_OUTPUT" ;;
              "0 16 * * 1")      echo "routes=automation" >> "$GITHUB_OUTPUT" ;;
              "0 17 * * 1")      echo "routes=process-followups" >> "$GITHUB_OUTPUT" ;;
              "0 19 * * 1")      echo "routes=daily-digest" >> "$GITHUB_OUTPUT" ;;
              "30 14 * * *")     echo "routes=poll-replies" >> "$GITHUB_OUTPUT" ;;
              *)                 echo "routes=" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Trigger route
        env:
          # Accept either secret name. The repo secret was originally created as
          # NEXT_PUBLIC_APP_URL, which resolved to empty against `secrets.APP_URL`
          # and failed every run with "curl: (3) No host part in the URL". The
          # literal is the last resort so a missing secret cannot silently
          # reintroduce that failure.
          APP_URL: ${{ secrets.APP_URL || secrets.NEXT_PUBLIC_APP_URL || 'https://fullstack-crm-nine.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          ROUTE="${{ steps.pick.outputs.routes }}"
          [ -n "$ROUTE" ] || { echo "No route mapped to this trigger"; exit 0; }

          # Fail loudly on an unset secret rather than emitting a bare 401.
          [ -n "${CRON_SECRET:-}" ] || { echo "::error::CRON_SECRET secret is empty"; exit 1; }

          echo "→ GET $APP_URL/api/cron/$ROUTE"
          CODE=$(curl -sS -o body.json -w '%{http_code}' --max-time 90 \
                   -H "Authorization: Bearer $CRON_SECRET" \
                   "$APP_URL/api/cron/$ROUTE")

          echo "HTTP $CODE"
          cat body.json; echo

          # A 200 alone is NOT success: the unauthenticated health check on some
          # routes also returns 200. Treat a health-check shape as a failure so a
          # broken secret can never look like a working job.
          if [ "$CODE" != "200" ]; then
            echo "::error::$ROUTE returned HTTP $CODE"; exit 1
          fi
          if grep -q '"note".*health check' body.json; then
            echo "::error::$ROUTE returned the health check — CRON_SECRET is wrong or missing"; exit 1
          fi
          echo "✓ $ROUTE completed"
